version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spam-detector-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql://spamuser:${DB_PASSWORD}@postgres:5432/spamdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - API_SECRET_KEY=${API_SECRET_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
      - ./ml_models:/app/ml_models
    networks:
      - spam-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spam-detector-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - spam-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: spam-detector-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=spamuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=spamdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - spam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spamuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: spam-detector-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spam-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker untuk async tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spam-detector-worker
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql://spamuser:${DB_PASSWORD}@postgres:5432/spamdb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
      - ./ml_models:/app/ml_models
    networks:
      - spam-network

  # Nginx Reverse Proxy (Optional, untuk production)
  nginx:
    image: nginx:alpine
    container_name: spam-detector-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - spam-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  spam-network:
    driver: bridge
